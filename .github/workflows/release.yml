name: Release Chinese APK

on:
  push:
    tags:
      - 'v*-cn.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OFFICIAL_APK_URL: https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.7/DiPlay-0.2.7.apk
      OFFICIAL_APK_SHA256: 27b434462da7e78b1ff0987d129ed0a4b0a0e56beceaf8ec221d47150d4675bd
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision runtime identity from official v0.2.7 APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/DiPlay-0.2.7.apk"
          assets="$RUNNER_TEMP/auth-assets"
          curl -fsSL -o "$apk" "$OFFICIAL_APK_URL"
          python3 scripts/extract_official_identity.py "$apk" "$assets" "$OFFICIAL_APK_SHA256"
          echo "PEUGEOTPLAY_AUTH_ASSETS_DIR=$assets" >> "$GITHUB_ENV"
      - name: Test and build standalone debug APK
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleStandaloneDebug --stacktrace
      - name: Verify identity is inside the APK and not in git
        run: |
          set -euo pipefail
          python3 scripts/check_public_tree.py
          python3 scripts/verify_apk_identity.py mobile/build/outputs/apk/debug/mobile-debug.apk
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          apk="PeugeotPlay-cn-${GITHUB_REF_NAME}.apk"
          cp mobile/build/outputs/apk/debug/mobile-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cp docs/GITHUB_RELEASE.md release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="PeugeotPlay-cn-${GITHUB_REF_NAME}.apk"
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            "$apk#PeugeotPlay CN" \
            "$apk.sha256#SHA-256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PeugeotPlay CN 0.2.7" \
            --notes-file release-notes.md
